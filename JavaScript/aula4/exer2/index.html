<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <h1 class="text-center">Simular empréstimo</h1>
        </header>
        <main>
            <div class="formulario">
                <form class="form-control border-0" method="post">
                    <input name="valorEmp" id="valorEmp" class="form-control" type="text" placeholder="Valor empréstimo">
                    <br>
                    <input name="taxaJuros" class="form-control" type="text" placeholder="Taxa de juros (Anual)">
                    <br>
                    <input id="tempo" class="form-control" type="text" placeholder="Tempo (Meses)">
                    <br>
                    <section class="text-center">
                        <button class="btn btn-primary" type="button" onclick="calcularJuros()">Calcular Juros</button>
                        <button class="btn btn-primary" onclick="limpar()">Limpar</button>
                        <button class="btn btn-primary" onclick="removerAnterior()">Remover</button>
                    </section>
                </form>
            </div>

            <div>
                <table class="table" id="table">
                    <thead>
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Valor total dos juros</th>
                            <th scope="col">Montante final</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaDados">
                        <!-- Dados tabela via JS -->
                    </tbody>
                </table>

        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script src="index.js"></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
